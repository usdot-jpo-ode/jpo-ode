# Benchmark workload service. Add it after the repository Compose file, from the repository root:
#   docker compose -f docker-compose.yml -f scripts/benchmarks/docker-compose.benchmark.yml \
#     --profile all --profile benchmark ...
# Relative paths resolve against the first file's directory (the repository root).
services:
  decode-benchmark:
    profiles:
      - benchmark
    build:
      context: .
      dockerfile: scripts/benchmarks/Dockerfile
    image: jpoode_decode_benchmark:python-3.12.5
    entrypoint: ["python", "/benchmarks/decode_benchmark.py"]
    environment:
      DECODE_BENCHMARK_UDP_HOST: ode
      DECODE_BENCHMARK_METRICS_URL: http://ode:8080/actuator/prometheus
      DECODE_BENCHMARK_HEALTH_URL: http://ode:8080/actuator/health
    volumes:
      - ./scripts/benchmarks:/benchmarks:ro
      - ./scripts/tests:/tests:ro
      - ./scripts/tests/output:/output
    depends_on:
      kafka:
        condition: service_healthy
      ode:
        condition: service_healthy
